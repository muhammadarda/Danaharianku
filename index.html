<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keuangan Terpadu</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d1c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b0d1c;--card:#141830;--card2:#1b2040;--tx:#eef0ff;--mut:#8b91b8;--ok:#34d399;--bad:#fb7185;--acc:#8b7cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f2fa;--card:#fff;--card2:#e9ebf8;--tx:#161a33;--mut:#5d6488;--ok:#0f9d6e;--bad:#d6334f}}
:root[data-theme="dark"]{--bg:#0b0d1c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
#app{max-width:480px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:22px;margin:2px 0 14px}
.sm{font-size:12px;color:var(--mut)}.row{display:flex;gap:8px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.hero{position:relative;border-radius:20px;padding:18px 16px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#7c5cff,#c04bd8)}
.hero.t{background:linear-gradient(135deg,#ff9f1c,#f43f5e)}
.hero b{display:block;font-size:30px;margin:4px 0 12px}
.chip{flex:1;background:rgba(255,255,255,.18);border-radius:10px;padding:8px}.chip span{font-size:11px;opacity:.85;display:block}.chip i{font-style:normal;font-weight:700}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--card2)}.li:first-child{border:0}
.li>div{min-width:0}.li b{white-space:nowrap}
.x{background:none;border:0;color:var(--mut);font-size:18px;padding:2px 6px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{height:6px;background:var(--card2);border-radius:3px;margin-top:6px}.bar u{display:block;height:100%;background:var(--acc);border-radius:3px}
.empty{text-align:center;padding:26px 10px}.empty p{margin:0 0 14px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-around}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 3px}
nav button em{font-style:normal;font-size:18px}nav .on{color:var(--acc);font-weight:700}
nav .fab{background:var(--acc);color:#fff;width:48px;height:48px;border-radius:15px;font-size:26px;justify-content:center;padding:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:18px}
input,select,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid transparent;border-radius:12px;padding:11px;font:inherit;margin-bottom:10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;width:100%;margin-bottom:8px}.btn.g{background:var(--card2);color:var(--tx)}.btn.r{background:none;color:var(--bad)}
.seg{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:8px}.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px;border-radius:9px;font:inherit;font-weight:600}.seg .on{background:var(--card2);color:var(--tx)}.pn{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.pn .x{font-size:24px;padding:0 14px}
.qc{background:var(--card2);color:var(--tx);border:0;border-radius:20px;padding:9px 14px;font:inherit;font-weight:600;margin:0 6px 8px 0}
.warn{background:#3a2f1c;color:#f6dfb2;border:1px solid #6b5326;border-radius:14px;padding:12px;margin-bottom:12px}.warn button{background:none;border:0;color:#ffd27a;font:inherit;font-weight:700;padding:4px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st{background:var(--card2);border-radius:12px;padding:10px;min-width:0}.st b{display:block;font-size:15px;margin:2px 0}.st .sm{display:block;font-size:11px}
#lk{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}.lkc{width:100%;max-width:320px;text-align:center;padding:16px}.lkc h2{margin:10px 0 14px;font-size:20px}.dots{display:flex;justify-content:center;gap:14px;min-height:16px;margin-bottom:8px}.dots u{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}.dots u.f{background:var(--acc);border-color:var(--acc)}.lm{min-height:38px;color:var(--bad);font-size:13px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}.pad button{background:var(--card);color:var(--tx);border:0;border-radius:50%;width:72px;height:72px;font:inherit;font-size:24px;font-weight:600;justify-self:center}.pad .gh{font-size:11px;color:var(--mut);background:none;font-weight:500}
.eye{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.2);border:0;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
.hd{display:flex;justify-content:space-between;align-items:center;margin:2px 0 14px}.eye2{background:var(--card);border:0;color:var(--tx);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}.big{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:4px 0 6px}.flow{flex:1;min-width:0}.flow b{display:block;font-size:17px;margin-top:4px}.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.qa button{background:var(--card);color:var(--tx);border:0;border-radius:16px;padding:12px 4px;font:inherit;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}.qa span{width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px}.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:12px 0}.stack i{display:block;height:100%}.lg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lg div{min-width:0}.lg b{display:block;font-size:14px;margin-top:2px}.lg u{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.chipbtn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600}.chipbtn.g{background:var(--card2);color:var(--tx)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;z-index:10}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<script>
var K="keuangan-terpadu-v2",TAB="home",S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.acc)S={acc:[],tx:[],tr:[]};
mig();
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var PM="month",PA=new Date();
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function syncJ(){JN=S.jn.map(function(x){return x.n});JC=S.jn.map(function(x){return x.c})}
function mig(){var t=ymd(new Date());if(!S.jn||!S.jn.length)S.jn=[{n:"Tabungan",c:"#4f8cff"},{n:"Investasi",c:"#34d399"},{n:"Dana darurat",c:"#fbbf24"},{n:"Lain-lain",c:"#a78bfa"}];if(typeof S.lim!="number")S.lim=0;if(!S.cf)S.cf=[];if(!S.kurs)S.kurs=16500;if(!S.bud)S.bud={};if(!S.rt)S.rt=[];if(!S.db)S.db=[];if(!S.tg)S.tg=[];if(!S.efm)S.efm=6;var nm=S.jn.map(function(j){return j.n});S.acc.forEach(function(a){if(nm.indexOf(a.g)<0)a.g=nm[nm.length-1]});S.tx.forEach(function(x){if(!x.d)x.d=t});S.tr=S.tr.map(function(x){return typeof x=="number"?{a:x,d:t}:x})}
function inP(d){var n=PM=="day"?10:PM=="month"?7:4;return String(d).slice(0,n)==ymd(PA).slice(0,n)}
function sd(d){return new Date(d+"T00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short"})}
function plabel(){return PM=="day"?PA.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}):PM=="month"?PA.toLocaleDateString("id-ID",{month:"long",year:"numeric"}):String(PA.getFullYear())}
function shift(n){var d=new Date(PA);if(PM=="day")d.setDate(d.getDate()+n);else if(PM=="month"){d.setDate(1);d.setMonth(d.getMonth()+n)}else{d.setDate(1);d.setFullYear(d.getFullYear()+n)}PA=d;draw()}
function setPM(m){PM=m;draw()}
function pbar(){return'<div class="seg">'+[["day","Hari"],["month","Bulan"],["year","Tahun"]].map(function(p){return'<button class="'+(PM==p[0]?"on":"")+'" onclick="setPM(\''+p[0]+'\')">'+p[1]+"</button>"}).join("")+'</div><div class="pn"><button class="x" aria-label="Sebelumnya" onclick="shift(-1)">‹</button><button class="x" style="font-size:15px;font-weight:700;color:var(--tx)" title="Kembali ke hari ini" onclick="PA=new Date();draw()">'+plabel()+'</button><button class="x" aria-label="Berikutnya" onclick="shift(1)">›</button></div>'}
var LOGO='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="36" height="36" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#d946a8"/></linearGradient><linearGradient id="lc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f5a623"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#lg)"/><circle cx="120" cy="90" r="150" fill="#fff" opacity=".08"/><circle cx="288" cy="168" r="54" fill="url(#lc)"/><circle cx="288" cy="168" r="38" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="6"/><rect x="108" y="206" width="296" height="200" rx="38" fill="#000" opacity=".18"/><rect x="108" y="196" width="296" height="200" rx="38" fill="#f6f3ff"/><path d="M128 252H388" stroke="#d3c9ff" stroke-width="6" stroke-linecap="round"/><rect x="316" y="268" width="112" height="72" rx="24" fill="#5b3fd9"/><circle cx="362" cy="304" r="12" fill="#ffd86b"/><path d="M392 108l7 17 17 7-17 7-7 17-7-17-17-7 17-7z" fill="#fff" opacity=".9"/></svg>';
var JN,JC;syncJ();
var $=function(i){return document.getElementById(i)};
var rp=function(n){return(n<0?"−":"")+"Rp"+Math.abs(Math.round(n)).toLocaleString("id-ID")};
var sum=function(a){return a.reduce(function(x,y){return x+y},0)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=document.createElement("div");t.id="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1800)}
var tot=function(t){return sum(S.tx.filter(function(x){return x.t==t&&inP(x.d)}).map(function(x){return x.a}))};
var empty=function(msg,btn,fn){return'<div class="card empty"><p>'+msg+'</p><button class="btn" onclick="'+fn+'">'+btn+"</button></div>"};
function bnr(){if(!S.acc.length&&!S.tx.length)return"";var d=S.lb?Math.floor((Date.now()-S.lb)/864e5):-1;if(d>=0&&d<7)return"";
return'<div class="warn">💾 '+(d<0?"Data belum pernah dicadangkan.":"Terakhir dicadangkan "+d+" hari lalu.")+'<br><button onclick="backup()">Cadangkan sekarang</button></div>'}
function catCard(t,ttl,cl){var m={},T=0;S.tx.forEach(function(x){if(x.t==t&&inP(x.d)){m[x.c]=(m[x.c]||0)+x.a;T+=x.a}});var ks=Object.keys(m).sort(function(a,b){return m[b]-m[a]});if(!ks.length)return"";
return'<div class="card"><div class="row" style="justify-content:space-between"><b>'+ttl+'</b><span class="sm">'+rp(T)+"</span></div>"+ks.map(function(k){var p=Math.round(m[k]/T*100);return'<div style="margin-top:12px"><div class="row" style="justify-content:space-between"><span>'+esc(k)+' <span class="sm">'+p+'%</span></span><b class="'+cl+'">'+rp(m[k])+'</b></div><div class="bar"><u style="width:'+p+"%;background:"+(t=="out"?"#fb7185":"var(--acc)")+'"></u></div></div>'}).join("")+"</div>"}
function greet(){var h=new Date().getHours();return h<11?"Selamat pagi":h<15?"Selamat siang":h<18?"Selamat sore":"Selamat malam"}
function quick(t){if(t=="rt"){PS="rt";go("plan");return}if(!S.acc.length){toast("Tambah rekening dulu");addAcc();return}add();$("ft").value=t;tfm()}
function recent(){var L=S.tx.map(function(x,k){return[x,k]}).sort(function(a,b){return a[0].d<b[0].d?1:a[0].d>b[0].d?-1:b[1]-a[1]}).slice(0,4);if(!L.length)return"";
return'<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><b>Transaksi terbaru</b><button class="x" style="font-size:13px;color:var(--acc)" onclick="go(\'hist\')">Lihat riwayat</button></div>'+L.map(function(p){var x=p[0],tf=x.t=="tf";return'<div class="li"><div>'+esc(x.n||x.c)+'<div class="sm">'+(tf?esc(x.acc)+" → "+esc(x.to):esc(x.c)+" · "+esc(x.acc))+" · "+sd(x.d)+'</div></div><b class="'+(tf?"":x.t=="in"?"ok":"bad")+'"'+(tf?' style="color:var(--acc)"':"")+">"+(tf?"⇄ ":x.t=="in"?"+":"−")+rp(x.a)+"</b></div>"}).join("")+"</div>"}
function home(){var i=tot("in"),o=tot("out"),A=sum(S.acc.map(function(a){return a.v})),U=sum(S.db.map(function(d){return d.sisa})),n=i-o;
return'<div class="hd"><div class="row" style="align-items:center;gap:10px">'+LOGO+'<div><div class="sm">'+greet()+'</div><b style="font-size:17px">Keuangan Terpadu</b></div></div><button class="eye2" aria-label="'+(S.hide?"Tampilkan saldo":"Sembunyikan saldo")+'" aria-pressed="'+(!!S.hide)+'" onclick="tgHide()">'+(S.hide?EYE0:EYE1)+"</button></div>"+pbar()+
'<div class="card bal"><span class="sm">'+(U>0?"Kekayaan bersih":"Total saldo")+'</span><div class="big">'+hv(A-U)+"</div>"+(U>0?'<div class="sm">Aset '+hv(A)+" · Utang −"+hv(U)+"</div>":"")+'<div class="sm">'+(n>=0?"▲":"▼")+' <b class="'+(n>=0?"ok":"bad")+'">'+rp(Math.abs(n))+"</b> "+(n>=0?"surplus":"defisit")+" pada periode ini</div></div>"+
'<div class="row"><div class="card flow"><span class="sm">⬇ Pemasukan</span><b class="ok">'+rp(i)+'</b></div><div class="card flow"><span class="sm">⬆ Pengeluaran</span><b class="bad">'+rp(o)+"</b></div></div>"+
'<div class="qa">'+[["out","➖","Pengeluaran"],["in","➕","Pemasukan"],["tf","⇄","Transfer"],["rt","🔁","Rutin"]].map(function(q){return'<button onclick="quick(\''+q[0]+'\')"><span>'+q[1]+"</span>"+q[2]+"</button>"}).join("")+"</div>"+
dueCard()+budAlert()+(S.acc.length?"":empty("Mulai dengan menambah rekening, misalnya bank atau e-wallet.","Tambah rekening","addAcc()"))+wealth()+recent()+
catCard("out","Pengeluaran per kategori","bad")+catCard("in","Pemasukan per sumber","ok")}
function hist(){var L=S.tx.map(function(x,k){return[x,k]}).filter(function(p){return inP(p[0].d)}).sort(function(a,b){return a[0].d<b[0].d?1:a[0].d>b[0].d?-1:b[1]-a[1]});
return"<h1>Riwayat</h1>"+pbar()+(L.length?'<div class="card">'+L.map(function(p){var x=p[0],tf=x.t=="tf";return'<div class="li"><div>'+esc(x.n||x.c)+'<div class="sm">'+(tf?esc(x.acc)+" → "+esc(x.to):esc(x.c)+" · "+esc(x.acc))+" · "+sd(x.d)+'</div></div><div><b class="'+(tf?"":x.t=="in"?"ok":"bad")+'"'+(tf?' style="color:var(--acc)"':"")+">"+(tf?"⇄ ":x.t=="in"?"+":"−")+rp(x.a)+'</b><button class="x" aria-label="Ubah" onclick="editTx('+p[1]+')">✎</button><button class="x" aria-label="Hapus" onclick="delTx('+p[1]+')">×</button></div></div>'}).join("")+"</div>":empty("Belum ada transaksi di periode ini.","Catat transaksi","add()"))}
var rst=0;
function rek(){var g=JN.map(function(j,ji){return{j:j,c:JC[ji],L:S.acc.map(function(a,k){return{a:a,k:k}}).filter(function(p){return p.a.g==j})}}).filter(function(G){return G.L.length});
return"<h1>Rekening</h1>"+(g.length?'<p class="sm" style="margin:-6px 0 12px">Ketuk nama rekening untuk mengubah jenisnya.</p>':"")+g.map(function(G){return'<div class="card"><div class="row" style="justify-content:space-between"><b style="color:'+G.c+'">'+G.j+'</b><b>'+hv(sum(G.L.map(function(p){return p.a.v})))+'</b></div>'+G.L.map(function(p){return'<div class="li"><button class="x" style="font-size:15px;color:var(--tx);text-align:left;padding:0" onclick="editAcc('+p.k+')">'+esc(p.a.n)+' <span class="sm">✎</span></button><div><b>'+hv(p.a.v)+'</b><button class="x" aria-label="Hapus" onclick="delAcc('+p.k+')">×</button></div></div>'}).join("")+"</div>"}).join("")+
'<button class="btn" onclick="addAcc()">Tambah rekening</button><button class="btn g" onclick="pinMenu()">'+(PIN?"Kunci PIN: aktif ✓":"Aktifkan kunci PIN")+'</button><button class="btn g" onclick="manageJ()">Kelola jenis rekening</button><button class="btn g" onclick="backup()">Cadangkan &amp; pulihkan data</button><button class="btn r" onclick="reset()">'+(rst?"Tekan lagi untuk hapus semua":"Hapus semua data")+"</button>"}
function short(n){return n>=1e9?"Rp"+(n/1e9).toFixed(1).replace(".",",")+" M":n>=1e6?"Rp"+(n/1e6).toFixed(1).replace(".",",")+" jt":rp(n)}
function wealth(){var G=JN.map(function(j,ji){return{j:j,c:JC[ji],v:sum(S.acc.filter(function(a){return a.g==j}).map(function(a){return a.v}))}}).filter(function(x){return x.v>0}),T=sum(G.map(function(x){return x.v}));if(!T)return"";
return'<div class="card"><b>Komposisi kekayaan</b><div class="stack" role="img" aria-label="Komposisi kekayaan">'+G.map(function(x){return'<i style="width:'+(x.v/T*100)+"%;background:"+x.c+'"></i>'}).join("")+'</div><div class="lg">'+G.map(function(x){return'<div><span class="sm"><u style="background:'+x.c+'"></u>'+esc(x.j)+" · "+Math.round(x.v/T*100)+"%</span><b>"+hv(x.v)+"</b></div>"}).join("")+"</div></div>"}
function editAcc(k){var a=S.acc[k];modal('<h2>Ubah rekening</h2><input id="f1" value="'+esc(a.n)+'" placeholder="Nama rekening"><select id="fg">'+jopts(a.g)+'</select><input id="f2" type="number" inputmode="numeric" value="'+a.v+'" placeholder="Saldo (Rp)"><button class="btn" onclick="saveG('+k+')">Simpan</button>')}
function saveG(k){var a=S.acc[k],n=$("f1").value.trim();if(!n){toast("Isi nama dulu");return}
S.tx.forEach(function(x){if(x.acc==a.n)x.acc=n;if(x.to==a.n)x.to=n});a.n=n;a.g=$("fg").value;a.v=parseFloat($("f2").value)||0;save();close_();draw()}
function manageJ(){modal('<h2>Jenis rekening</h2><p class="sm">Ubah nama dan warna, hapus, atau tambah jenis baru.</p>'+S.jn.map(function(j,i){return'<div class="row" style="align-items:center"><input id="jn'+i+'" value="'+esc(j.n)+'" aria-label="Nama jenis"><input id="jc'+i+'" type="color" value="'+j.c+'" aria-label="Warna" style="width:60px;height:44px;padding:4px"><button class="x" aria-label="Hapus jenis" onclick="delJ('+i+')">×</button></div>'}).join("")+'<div class="row" style="align-items:center"><input id="jnN" placeholder="Jenis baru (opsional)"><input id="jcN" type="color" value="#ff7a59" aria-label="Warna" style="width:60px;height:44px;padding:4px"></div><button class="btn" onclick="applyJ(1)">Simpan</button>')}
function applyJ(c){var old=S.jn,nw=[],used={};

function restoreFile(inp){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.acc||!d.tx||!d.tr)throw 0;S=d;mig();syncJ();save();close_();draw();toast("Data dipulihkan")}catch(e){toast("File tidak valid")}};r.readAsText(f)}
function backup(){var cs=false;try{cs=!!(navigator.canShare&&navigator.canShare({files:[new File(["x"],"a.json",{type:"application/json"})]}))}catch(e){}
modal('<h2>Cadangan data</h2><p class="sm">'+(S.lb?"Terakhir dicadangkan: "+new Date(S.lb).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})+".":"Belum pernah dicadangkan.")+' Simpan filenya di tempat aman, misalnya Google Drive atau kirim ke dirimu sendiri.</p><button class="btn" onclick="fileBackup()">Simpan cadangan ke file</button>'+(cs?'<button class="btn g" onclick="shareBackup()">Bagikan file cadangan</button>':"")+'<button class="btn g" onclick="csvOut()">Ekspor transaksi (CSV)</button><label class="btn g" style="display:block;text-align:center;cursor:pointer">Pulihkan dari file<input type="file" accept=".json,application/json,text/plain" style="display:none" onchange="restoreFile(this)"></label><p class="sm">Memulihkan akan menggantikan semua data saat ini.</p><details><summary class="sm" style="cursor:pointer">Cara lain: salin &amp; tempel teks</summary><textarea id="bk" rows="5" style="margin-top:8px">'+esc(JSON.stringify(S))+'</textarea><div class="row"><button class="btn g" onclick="cp()">Salin</button><button class="btn g" onclick="rs()">Pulihkan</button></div></details>')}
function cp(){var t=$("bk");t.select();try{document.execCommand("copy");S.lb=Date.now();save();toast("Tersalin")}catch(e){toast("Salin manual dari kolom")}}
function rs(){try{var d=JSON.parse($("bk").value);if(!d.acc||!d.tx||!d.tr)throw 0;S=d;mig();syncJ();save();close_();draw();toast("Data dipulihkan")}catch(e){toast("Format data tidak valid")}}
if(PIN)lock();else{draw();remind()}
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
</script>
